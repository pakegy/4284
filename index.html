<!doctype html>
<html lang="ar" dir="rtl">

<meta charset="UTF-8">

<title>4284</title>

<meta name="description"
content="ولقد ذكرتك والرماح نواهلٌ مني وبيض الهند تقطر من دمي — عنترة بن شداد">

<meta name="robots" content="index, follow">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="code">4284</div>

<div class="verse">
ولقد ذكرتك والرماح نواهلٌ<br>
مني وبيض الهند تقطر من دمي
</div>

<div class="author">
— عنترة بن شداد
</div>
<div class="intro">

    <h1>رسائلك لها كود</h1>
    <p>
        اكتب رسالتك وحوّلها إلى كود 4284
        <br>
        أو أدخل كودًا لاكتشاف الرسالة.
    </p>
<div class="message-box">

    <textarea
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
        maxlength="2000"
    ></textarea>
<input
    type="password"
    id="passwordInput"
    placeholder="كلمة المرور السرية..."
    autocomplete="new-password"
>
    <button id="encodeBtn">
        تحويل الرسالة إلى كود
    </button>

    <div class="divider">أو</div>

    <input
        type="text"
        id="codeInput"
        placeholder="أدخل كود 4284..."
        autocomplete="off"
    >
<input
    type="password"
    id="decodePasswordInput"
    placeholder="كلمة المرور السرية..."
    autocomplete="new-password"
>
    <button id="decodeBtn">
        كشف الرسالة
    </button>

    <div id="result" class="result"></div>

</div>

</div>
</div>
<script src="script.js?v=2"></script>
</body>
</html>
